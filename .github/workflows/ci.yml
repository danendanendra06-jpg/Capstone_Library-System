name: Capstone CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-spring-boot:
    name: Build Spring Boot API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-spring

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml -DskipTests

  analyze-flutter:
    name: Analyze Flutter App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_flutter

    steps:
    - uses: actions/checkout@v3
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - name: Install Dependencies
      run: flutter pub get
    - name: Analyze Code
      run: flutter analyze --no-fatal-infos
